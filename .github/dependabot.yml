version: 2
updates:
  # The workflows pin every action to a full commit SHA. Dependabot updates
  # the SHA and the trailing version comment together.
  #
  # There is no npm ecosystem here any more: since v3.0.0 the project has zero
  # runtime and build dependencies and no lockfile, so the former npm section
  # (with its Next.js / TypeScript 7 notes) had nothing left to update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
