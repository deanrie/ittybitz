name: security.txt

# RFC 9116: an expired security.txt is invalid. Expiry approaches whether or
# not anyone pushes, so this runs weekly as well as on edits, and fails 30 days
# before the date so there is time to renew.

on:
  push:
    paths: ["site/.well-known/security.txt", ".github/workflows/security-txt.yml"]
  pull_request:
    paths: ["site/.well-known/security.txt", ".github/workflows/security-txt.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  expiry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: security.txt has more than 30 days left
        run: |
          node -e '
            const t = require("fs").readFileSync("site/.well-known/security.txt", "utf8");
            const m = t.match(/^Expires:\s*(\S+)/m);
            if (!m) { console.error("::error::security.txt has no Expires field"); process.exit(1); }
            const days = (Date.parse(m[1]) - Date.now()) / 864e5;
            if (!(days > 30)) { console.error(`::error::security.txt Expires ${m[1]} is ${Math.round(days)} days away; renew it (keep under one year, RFC 9116)`); process.exit(1); }
            console.log(`security.txt expires ${m[1]} (${Math.round(days)} days)`);
          '
